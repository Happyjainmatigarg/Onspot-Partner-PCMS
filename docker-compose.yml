# Docker Compose for OnSpot Ecosystem
# For production deployment with MongoDB container

services:
  # MongoDB Database
  mongodb:
    image: mongo:7.0
    restart: unless-stopped
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_ROOT_USER:-admin}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_ROOT_PASSWORD:-OnSpotDB2026!}
      - MONGO_INITDB_DATABASE=onspot
    volumes:
      - mongodb_data:/data/db
    ports:
      - "27017:27017"
    networks:
      - onspot-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  # Backend API
  backend:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=3000
      - MONGODB_URI=mongodb://${MONGO_ROOT_USER:-admin}:${MONGO_ROOT_PASSWORD:-OnSpotDB2026!}@mongodb:27017/onspot?authSource=admin
      - JWT_SECRET=${JWT_SECRET:-onspot-jwt-secret-change-me}
      - CORS_ORIGINS=${CORS_ORIGINS:-https://partner.onspot.one,https://customer.onspot.one,https://admin.onspot.one}
      - EMAIL_HOST=${EMAIL_HOST:-smtp.gmail.com}
      - EMAIL_PORT=${EMAIL_PORT:-587}
      - EMAIL_USER=${EMAIL_USER}
      - EMAIL_PASS=${EMAIL_PASS}
      - EMAIL_FROM=${EMAIL_FROM:-partner@onspot.one}
      - PARTNER_APP_URL=${PARTNER_APP_URL:-https://partner.onspot.one}
      - CUSTOMER_APP_URL=${CUSTOMER_APP_URL:-https://customer.onspot.one}
      - ADMIN_APP_URL=${ADMIN_APP_URL:-https://admin.onspot.one}
      - FONOSTER_API_KEY=${FONOSTER_API_KEY}
      - FONOSTER_API_SECRET=${FONOSTER_API_SECRET}
      - FONOSTER_PROJECT_ID=${FONOSTER_PROJECT_ID}
      - FONOSTER_FROM_NUMBER=${FONOSTER_FROM_NUMBER}
    ports:
      - "4001:3000"
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - onspot-network
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:3000/api/health', (r) => process.exit(r.statusCode === 200 ? 0 : 1))\""]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # Partner App (Next.js)
  partner:
    build:
      context: ./apps/partner
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=${BACKEND_URL:-http://backend:3000}
    ports:
      - "4002:3000"
    depends_on:
      - backend
    networks:
      - onspot-network

  # Customer App (Next.js)
  customer:
    build:
      context: ./apps/customer
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=${BACKEND_URL:-http://backend:3000}
    ports:
      - "4003:3000"
    depends_on:
      - backend
    networks:
      - onspot-network

  # Admin App (Next.js)
  admin:
    build:
      context: ./apps/admin
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=${BACKEND_URL:-http://backend:3000}
    ports:
      - "4004:3000"
    depends_on:
      - backend
    networks:
      - onspot-network

volumes:
  mongodb_data:
    driver: local

networks:
  onspot-network:
    driver: bridge

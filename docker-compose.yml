# Docker Compose for OnSpot Ecosystem
# For production deployment (Dokploy) with MongoDB Atlas
# Note: Dokploy handles external routing via Traefik proxy

services:
  # Backend API
  backend:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=3000
      - MONGODB_URI=${MONGODB_URI}
      - JWT_SECRET=${JWT_SECRET:-onspot-jwt-secret-change-me}
      - CORS_ORIGINS=${CORS_ORIGINS:-https://partner.onspot.one,https://customer.onspot.one,https://admin.onspot.one}
      - EMAIL_HOST=${EMAIL_HOST:-smtp.gmail.com}
      - EMAIL_PORT=${EMAIL_PORT:-587}
      - EMAIL_USER=${EMAIL_USER}
      - EMAIL_PASS=${EMAIL_PASS}
      - EMAIL_FROM=${EMAIL_FROM:-partner@onspot.one}
      - PARTNER_APP_URL=${PARTNER_APP_URL:-https://partner.onspot.one}
      - CUSTOMER_APP_URL=${CUSTOMER_APP_URL:-https://customer.onspot.one}
      - ADMIN_APP_URL=${ADMIN_APP_URL:-https://admin.onspot.one}
      - FONOSTER_API_KEY=${FONOSTER_API_KEY}
      - FONOSTER_API_SECRET=${FONOSTER_API_SECRET}
      - FONOSTER_PROJECT_ID=${FONOSTER_PROJECT_ID}
      - FONOSTER_FROM_NUMBER=${FONOSTER_FROM_NUMBER}
    expose:
      - "3000"
    networks:
      - onspot-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Partner App (Next.js)
  partner:
    build:
      context: ./apps/partner
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=${BACKEND_URL:-http://backend:3000}
    expose:
      - "3000"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - onspot-network

  # Customer App (Next.js)
  customer:
    build:
      context: ./apps/customer
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=${BACKEND_URL:-http://backend:3000}
    expose:
      - "3000"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - onspot-network

  # Admin App (Next.js)
  admin:
    build:
      context: ./apps/admin
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=${BACKEND_URL:-http://backend:3000}
    expose:
      - "3000"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - onspot-network

networks:
  onspot-network:
    driver: bridge
